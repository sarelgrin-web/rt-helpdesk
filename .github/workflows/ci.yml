name: App CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: PostgreSQL and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: helpdesk_test
          POSTGRES_USER: helpdesk_test
          POSTGRES_PASSWORD: disposable-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpdesk_test -d helpdesk_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: helpdesk_test
      DB_USER: helpdesk_test
      DB_PASSWORD: disposable-test-password
      DB_SSLMODE: disable
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/results.xml
      - name: Build runtime image without publishing it
        run: docker build --target runtime -t rt-helpdesk:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/results.xml

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive reference/terraform
      - name: Validate bootstrap Terraform configuration
        working-directory: reference/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate lab Terraform configuration
        working-directory: reference/terraform/lab
        run: |
          terraform init -backend=false -input=false
          terraform validate
